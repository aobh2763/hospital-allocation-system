[project]
name = "emergency-management-agent"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "you@example.com"}
]
requires-python = ">=3.14"
dependencies = [
    "numpy (>=2.5.4,<3.0.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "pathlib (>=1.0.1,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "joblib (>=1.6.0,<2.0.0)",
    "janus-swi (>=1.5.3,<2.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
cuml-cu12 = { version = "*", source = "rapids-pip" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.4.0,<8.0.0)"
]

[[tool.poetry.source]]
name = "rapids-pip"
url = "https://nvidia.com"
priority = "explicit"
